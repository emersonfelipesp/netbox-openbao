---
name: CI

# Pre-merge static and affected DB-backed gates. Both use the credentials-free,
# non-root ci-untrusted-python312 host executor without Docker access.
#
# The PR job extracts signed Debian PostgreSQL 15 packages and a hash-pinned
# Redis 6 wheel, then starts both as unprivileged local processes. Optional
# live OpenBao tests still require the development stack in docs/development.md.
#
# Runner: `ci-untrusted-python312` is a self-hosted label carrying Python 3.12
# and `uv`. It runs with no service containers or Docker socket, and uses the
# image's pinned Python toolchain rather than `actions/setup-python`.
#
# GitHub's separate workflow currently runs the same static checks on
# GitHub-hosted runners; this 70-test DB-backed gate runs on Gitea PRs into
# develop and main. The trusted compatibility harness defaults to the full
# plugin suite.

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: netbox-openbao-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Static checks and packaging
    runs-on: ci-untrusted-python312
    timeout-minutes: 20
    env:
      HOME: ${{ github.workspace }}
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Assert the untrusted runner has no Docker socket
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /var/run/docker.sock
          test ! -e /run/docker.sock
          test -z "${DOCKER_HOST:-}"
          echo 'Untrusted runner has no Docker socket or Docker host configured'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create the environment
        shell: bash
        run: |
          set -euo pipefail
          command -v uv
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python ruff build

      - name: Ruff lint
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/ruff check .

      - name: Compile all sources
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m compileall -q netbox_openbao

      - name: Test cluster administration JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check netbox_openbao/static/netbox_openbao/cluster_administration.js
          node --check netbox_openbao/static/netbox_openbao/authentication_administration.js
          node --check netbox_openbao/static/netbox_openbao/secret_engine_administration.js
          node --check netbox_openbao/static/netbox_openbao/access_administration.js
          node --check netbox_openbao/static/netbox_openbao/finalization_administration.js
          node --test netbox_openbao/tests/js/*.test.js

      - name: Build the distribution
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m build

      - name: Assert no model field can hold secret material
        shell: bash
        run: |
          set -euo pipefail
          # The dependency-free restatement of the central claim in
          # netbox_openbao/tests/test_security.py, for a runner that cannot
          # stand up NetBox. The forbidden-token list lives in the script and
          # is imported by that test, so the two cannot drift — an earlier
          # inline copy here checked three of the five tokens and only plain
          # assignments, so an annotated field or `secret_data` would have
          # passed every check this workflow advertised.
          .venv/bin/python scripts/check_no_secret_fields.py

      - name: Assert the NetBox compatibility contract
        shell: bash
        run: .venv/bin/python scripts/check_compatibility_contract.py

      - name: Assert the OpenBao UI parity manifest
        shell: bash
        run: .venv/bin/python scripts/check_openbao_ui_parity.py

  netbox-tests:
    name: NetBox 4.7 affected regression tests
    needs: quality
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ci-untrusted-python312
    timeout-minutes: 55
    env:
      HOME: ${{ github.workspace }}
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_PYTHON_DOWNLOADS: never
      NETBOX_SHA: 5f06007e4c9bacc93ce17c1e645fc1143d60df3d # v4.7.0 GA
      NETBOX_RPC_SHA: e8d4ba3535e2b4f33125c16281a34da52b634df0
      NETBOX_CI_TEST_SCOPE: affected
    steps:
      - name: Assert the untrusted runner has no Docker socket
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /var/run/docker.sock
          test ! -e /run/docker.sock
          test -z "${DOCKER_HOST:-}"
          test "$(id -u)" -ne 0
          echo 'Rootless PR runner has no Docker socket or Docker host configured'

      - name: Checkout pull request
        uses: https://git.nmulti.cloud/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Fetch pinned RPC source from the public mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deps/netbox-rpc
          git -C .deps/netbox-rpc init -q
          git -C .deps/netbox-rpc remote add origin https://github.com/N-MultiCloud/netbox-rpc.git
          git -C .deps/netbox-rpc fetch --depth=1 origin "$NETBOX_RPC_SHA"
          git -C .deps/netbox-rpc checkout --detach FETCH_HEAD
          test "$(git -C .deps/netbox-rpc rev-parse HEAD)" = "$NETBOX_RPC_SHA"
          test -z "$(git -C .deps/netbox-rpc status --porcelain=v1 --untracked-files=all)"

      - name: Install the hash-locked Redis CI binary
        shell: bash
        run: |
          set -euo pipefail
          command -v uv
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python --require-hashes --no-deps \
            --only-binary :all: -r .gitea/ci-db-tools.txt

      - name: Run the 70 affected tests against pinned NetBox source
        shell: bash
        run: bash scripts/ci_rootless_netbox_suite.sh
