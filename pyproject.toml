[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-openbao"
# Single-sourced from `netbox_openbao.__version__`, which NetBox itself reads
# off the PluginConfig. Two literals would drift, and a plugin reporting a
# version its distribution does not carry is the kind of thing nobody notices
# until they are trying to reproduce a bug report.
#
# setuptools resolves this by parsing the module's AST, not by importing it, so
# the build does not need NetBox installed.
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "hvac>=2.3.0",
    "cryptography>=42.0.0",
    # cryptography delegates the OpenSSH bcrypt KDF to this package. Without it,
    # loading a passphrase-protected OpenSSH private key raises
    # UnsupportedAlgorithm("Need bcrypt module"). NetBox does not ship it.
    "bcrypt>=4.0.0",
    # Validates operator-defined credential type schemas. Already a dependency
    # elsewhere in this estate, so the pattern is established.
    "jsonschema>=4.0.0",
]
authors = [
    {name = "Emerson Felipe", email = "emerson@netdevopsbr.com"},
]
description = "Keep NetBox device, VM, and service secret material in OpenBao while NetBox owns the credential inventory"
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
keywords = ["netbox", "netbox-plugin", "openbao", "vault", "secrets", "credentials"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/emersonfelipesp/netbox-openbao"
Documentation = "https://emersonfelipesp.github.io/netbox-openbao/"
Source = "https://github.com/emersonfelipesp/netbox-openbao"
Issues = "https://github.com/emersonfelipesp/netbox-openbao/issues"
Changelog = "https://github.com/emersonfelipesp/netbox-openbao/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Documentation site. Kept out of the runtime dependencies: a NetBox host has
# no reason to install a static-site generator.
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "netbox_openbao.__version__"}

[tool.setuptools.packages.find]
include = ["netbox_openbao*"]

[tool.setuptools.package-data]
netbox_openbao = ["templates/**", "static/**"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
# S105/S106: the "hardcoded password" heuristic fires on every choice value and
# kwarg literally named token/password in a secrets plugin. Real secret handling
# is covered by tests/test_security.py, not by this heuristic.
ignore = ["S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"netbox_openbao/tests/*" = ["S101", "S105", "S106", "S603", "S607"]
"netbox_openbao/migrations/*" = ["E501"]

[tool.pytest.ini_options]
markers = [
    "django_db: requires pytest-django database access",
    "integration: requires a live OpenBao dev server",
]
