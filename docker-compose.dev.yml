---
# Development stack: NetBox 4.7 plus everything it and this plugin require.
#
# PostgreSQL must be 15 or newer with the `ltree` extension available — NetBox
# 4.7 backs its hierarchical models with ltree rather than django-mptt, and
# migrations fail without it. Redis must be 6 or newer.
#
# OpenBao runs in dev mode: in-memory, auto-unsealed, with a fixed root token.
# That is appropriate for a laptop and for CI, and appropriate nowhere else.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: netbox
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  openbao:
    image: openbao/openbao:2.6.0
    command: server -dev
    environment:
      BAO_DEV_ROOT_TOKEN_ID: devroot
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      # The dev server reports 200 on sys/health once unsealed and active.
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 10
