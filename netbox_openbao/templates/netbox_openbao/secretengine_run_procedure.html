{% extends 'generic/object.html' %}

{% block content %}
<div class="row">
  <div class="col-md-8">
    <form method="post" class="form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">{% trans "Run procedure" %}</button>
      <a href="{{ return_url }}" class="btn btn-secondary">{% trans "Cancel" %}</a>
    </form>
  </div>
</div>
{% endblock %}
