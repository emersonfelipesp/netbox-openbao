name: Release validation and public publishing

on:
  push:
    tags: ["v*rc*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing final release tag to retry after a publishing failure
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-build:
    if: ${{ github.repository == 'emersonfelipesp/netbox-openbao' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      repository_url: ${{ steps.release.outputs.repository_url }}
      target: ${{ steps.release.outputs.target }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout protected canonical-main policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Validate event, tag, and package version
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          test "$EVENT_NAME" != release || tag="$RELEASE_TAG"
          test "$EVENT_NAME" != workflow_dispatch || tag="$DISPATCH_TAG"
          if test "$EVENT_NAME" = workflow_dispatch; then
            printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?$'
          fi
          event=final
          if test "$EVENT_NAME" = push; then
            event=rc
            echo 'target=testpypi' >> "$GITHUB_OUTPUT"
            echo 'repository_url=https://test.pypi.org/legacy/' >> "$GITHUB_OUTPUT"
          else
            echo 'target=pypi' >> "$GITHUB_OUTPUT"
            echo 'repository_url=https://upload.pypi.org/legacy/' >> "$GITHUB_OUTPUT"
          fi
          git fetch --force --no-tags origin "+refs/tags/${tag}:refs/release-policy/candidate"
          git fetch --force --no-tags origin "+refs/heads/main:refs/release-policy/main"
          policy_sha="$(git rev-parse HEAD^{commit})"
          test "$policy_sha" = "$(git rev-parse refs/release-policy/main^{commit})"
          python scripts/validate_release_ref.py --repository . --tag "$tag" \
            --event "$event" \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout validated release source
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[a-f0-9]{40}$'
          test "$SOURCE_SHA" = "$(git rev-parse refs/release-policy/candidate^{commit})"
          git checkout --detach --force "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$(git rev-parse HEAD^{commit})"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build and check distributions
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'build==1.3.0' 'twine==6.2.0'
          python -m build
          python -m twine check dist/*

      - name: Transfer validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-release-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: validate-build
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.validate-build.outputs.target }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-release-dist
          path: dist

      - name: Publish release candidate through trusted publishing
        if: ${{ github.event_name == 'push' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: ${{ needs.validate-build.outputs.repository_url }}

      - name: Publish final with the scoped API token
        if: ${{ github.event_name != 'push' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: ${{ needs.validate-build.outputs.repository_url }}
          password: ${{ secrets.PYPI_TOKEN }}
