---
name: Publish documentation

# Builds the Material for MkDocs site and publishes it to GitHub Pages.
#
# Manual and release-triggered only, not on every push to main: the site
# documents the released behaviour, and republishing it from an unreleased main
# would have the published docs describe something nobody can install yet.
#
# GitHub Pages must be enabled for the repository with "GitHub Actions" as the
# source before the first run; the deploy step fails with a 404 otherwise, which
# does not read like a configuration problem.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: netbox-openbao-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the documentation dependencies
        # The package itself is deliberately NOT installed — see the docs job in
        # ci.yml for why.
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'mkdocs-material>=9.5' 'mkdocstrings[python]>=0.26' \
                                'mkdocs-gen-files>=0.5' 'mkdocs-literate-nav>=0.6'

      - name: Build
        run: mkdocs build --strict

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
